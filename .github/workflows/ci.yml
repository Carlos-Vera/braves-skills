name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shell syntax check (sh -n)
        run: |
          for f in hooks/*.sh scripts/*.sh tests/*.sh; do
            echo "Checking $f"
            sh -n "$f"
          done

      - name: Ensure shellcheck is available
        run: command -v shellcheck || (sudo apt-get update && sudo apt-get install -y shellcheck)

      - name: shellcheck
        run: shellcheck hooks/*.sh scripts/*.sh tests/*.sh

      - name: Validate JSON
        run: |
          jq -e . hooks/hooks.json > /dev/null
          jq -e . .claude-plugin/plugin.json > /dev/null

      - name: Skills list matches skills/ directory
        run: |
          diff <(ls -d skills/*/ | xargs -n1 basename | sort) \
               <(jq -r '.skills[]' .claude-plugin/plugin.json | sed 's#^\./skills/##' | sort)

      # agy skips a skill whose SKILL.md lacks frontmatter (Claude Code is lenient and hid it).
      - name: Every skill has name and description frontmatter
        run: |
          for f in skills/*/SKILL.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "::error file=$f::missing frontmatter"; exit 1; }
            fm=$(awk 'NR>1 && /^---$/ {exit} NR>1' "$f")
            printf '%s\n' "$fm" | grep -q '^name: ' || { echo "::error file=$f::frontmatter has no name"; exit 1; }
            printf '%s\n' "$fm" | grep -q '^description:' || { echo "::error file=$f::frontmatter has no description"; exit 1; }
          done

      - name: Hook behaviour tests
        run: sh tests/hooks.sh

      - name: Gemini dispatch behaviour tests
        run: sh tests/gemini-dispatch.sh

      - name: Contrast script self-test
        run: python3 skills/braves-audit/a11y/contrast-check.py --selftest

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # Pinned, like every dependency here: bump it by hand to a release that
      # has been public for at least 24 h.
      - name: Panel mod tests
        run: |
          corepack enable pnpm
          pnpm dlx @anthropic-ai/claude-code@2.1.325 plugin test mods/braves-panel
