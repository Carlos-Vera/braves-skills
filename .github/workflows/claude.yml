name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: read

jobs:
  claude:
    # AND-gate on the actor and the keyword. The `issues` event additionally
    # pins `issue.user.login`: otherwise anyone could open an issue containing
    # `@claude` and wait for the maintainer to assign it — `sender` would be the
    # maintainer while the prompt text stayed attacker-authored. Both the
    # trigger and the prompt have to come from the same trusted account.
    if: |
      github.event.sender.login == 'Carlos-Vera' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && github.event.issue.user.login == 'Carlos-Vera' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # post inline review-thread comments, not just a sticky one
      issues: read
      id-token: write
      actions: read # read CI results on the PR under review
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run Claude Code
        uses: anthropics/claude-code-action@3f854a8fb5146b39d5cbf8b57f70d80810e1366f # v1.0.198
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
